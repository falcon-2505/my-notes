function tr(x){return WORDS[visual.lang]?.[x]||x}
function localize(){if(visual.lang==='en')return;let walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),node;while(node=walker.nextNode()){if(node.parentElement?.closest('.card,.theme-preview,.theme-option,#editorbody,#filters,.note-user'))continue;let v=node.nodeValue,trim=v.trim();if(WORDS[visual.lang][trim])node.nodeValue=v.replace(trim,tr(trim));else if(trim.startsWith('← ')&&WORDS[visual.lang][trim.slice(2)])node.nodeValue=v.replace(trim,'← '+tr(trim.slice(2)));else if(trim.startsWith('＋ Folders'))node.nodeValue=v.replace('Folders',tr('Folders'));else if(trim.startsWith('Created '))node.nodeValue=v.replace('Created ',tr('Created')+' ')}el.querySelectorAll('input[placeholder],textarea[placeholder]').forEach(n=>{if(n.closest('#editorbody')&&n.value)return;n.placeholder=tr(n.placeholder)});el.querySelectorAll('[title],[aria-label]').forEach(n=>{if(n.title)n.title=tr(n.title);if(n.getAttribute('aria-label'))n.setAttribute('aria-label',tr(n.getAttribute('aria-label')))});}
function languageMenu(){return `<div class="language-menu"><button class="iconbtn language-btn" data-act="language" title="${tr('Language')}" aria-label="${tr('Language')}">${icon('language')}<span>${visual.lang.toUpperCase()}</span></button><div class="lang-pop" id="lang-pop" hidden>${[['uz','🇺🇿 O‘zbekcha'],['ru','🇷🇺 Русский'],['en','🇬🇧 English']].map(([c,l])=>`<button type="button" data-lang="${c}" class="${visual.lang===c?'chosen':''}">${l}${visual.lang===c?' ✓':''}</button>`).join('')}</div></div>`}
function headerTools(){return `${ib('layers',tr('Design Switch'),'design',visual.design==='glass')}${ib('moon',tr('Dark Mode'),'darkon',visual.dark)}${ib('sun',tr('Light Mode'),'lighton',!visual.dark)}${languageMenu()}${ib('lock',tr('Lock App'),'lockapp')}`}
function show(){applyVisual();if(screen==='lock')lockView();else if(screen==='home')homeView();else if(screen==='edit')editorView();else if(screen==='settings')settingsView();else if(screen==='themes')themesView();else if(screen==='pinchange')pinChangeView();else if(screen==='folders')foldersView();localize()}
function lockView(){let exists=!!localStorage.getItem(KEY);el.innerHTML=`<div class="lockscreen"><div class="emoji">🔐</div><h1>My Notes</h1><p class="sub">${exists?'Enter your 4-digit PIN':'Create your 4-digit PIN'}</p><form id="pinform"><input id="pin" inputmode="numeric" type="password" pattern="[0-9]{4}" minlength="4" maxlength="4" required autocomplete="off" placeholder="••••"><button class="btn" type="submit">${exists?'Unlock':'Create PIN'}</button></form><p class="hint">Keep your PIN safe. There is no password recovery.</p><div class="spacer"></div><button class="btn light" id="preview">👁 Preview App — See Design</button></div>`;$('#pinform').onsubmit=async e=>{e.preventDefault();let pin=$('#pin').value;if(!/^\d{4}$/.test(pin))return toast(tr('Enter a 4-digit PIN'));try{if(exists){let d=await decrypt(localStorage.getItem(KEY),pin);vault=normalizeVault(d.value);cryptoKey=d.key;salt=d.s}else{vault={notes:[],folders:['Personal','Work','Ideas'],dark:false,nextColor:0};salt=rand(16);cryptoKey=await derive(pin,salt);await persist()}preview=false;sessionUnlocked=true;screen='home';show()}catch(err){toast(tr('Incorrect PIN or damaged data'))}};$('#preview').onclick=()=>{preview=true;vault=demo();screen='home';show()};localize()}
function header(title,right=''){return `<div class="top"><h1>${title}</h1><div class="row">${preview?'<span class="preview-tag">PREVIEW</span>':''}${right}</div></div>`}
function homeView(){let a=[...vault.notes].sort((x,y)=>Number(y.pinned)-Number(x.pinned)||new Date(y.updated)-new Date(x.updated));a=a.filter(n=>(folderFilter==='All'||n.folder===folderFilter)&&(!query||n.title.toLowerCase().includes(query.toLowerCase())||(!n.locked&&n.body?.toLowerCase().includes(query.toLowerCase()))));el.innerHTML=header('My Notes 📝',`${headerTools()}`)+`<input id="search" placeholder="Search your notes..." value="${esc(query)}" style="width:100%"><div class="row" style="justify-content:flex-end;margin:10px 0 4px"><button class="btn light" data-act="settings">⚙ ${tr('Settings')}</button></div><div class="bar" id="filters">${['All',...vault.folders].map(f=>`<button class="chip ${folderFilter===f?'active':''}" data-folder="${esc(f)}">${esc(f)}</button>`).join('')}<button class="chip" data-act="folders">＋ Folders</button></div><div class="cards">${a.map(n=>`<article class="card" data-open="${esc(n.id)}" style="background:${n.bg};color:${n.ink}"><div class="row" style="justify-content:space-between"><h3>${n.pinned?'📌 ':''}${esc(n.title||'Untitled')}</h3>${n.locked?'🔒':''}</div><p>${n.locked?'Protected note':n.type==='todo'?esc(n.tasks.map(t=>(t.done?'☑ ':'☐ ')+t.text).join('\n')):esc(n.body)}</p><footer>${fmt(n.created)}</footer></article>`).join('')}</div>${a.length?'':'<p class="muted" style="margin:30px 0;text-align:center">No notes yet. Tap + to create one.</p>'}<button class="fab" data-act="new" title="New Note">+</button>`;$('#search').oninput=e=>{query=e.target.value;homeView();$('#search').focus();$('#search').setSelectionRange(query.length,query.length)};document.querySelectorAll('[data-folder]').forEach(b=>b.onclick=()=>{folderFilter=b.dataset.folder;show()});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openNote(b.dataset.open));bindActions();localize()}
function openNote(id){let n=vault.notes.find(n=>n.id===id);if(!n)return;if(n.locked&&!preview){let pin=prompt(tr('Enter your 4-digit PIN'));if(pin===null)return;decrypt(localStorage.getItem(KEY),pin).then(()=>edit(id)).catch(()=>toast(tr('Incorrect PIN')))}else edit(id)}
function newNote(){let c=BG[vault.nextColor++%BG.length];selected={id:(crypto.randomUUID?.()||String(Date.now())+'-'+Math.random().toString(36).slice(2)),title:'',type:'text',body:'',tasks:[],bg:c,ink:'#202020',folder:'',pinned:false,locked:false,reminder:'',created:now(),updated:now()};vault.notes.unshift(selected);scheduleSave();screen='edit';panel='';show()}
function edit(id){selected=vault.notes.find(n=>n.id===id);if(!selected)return;screen='edit';panel='';show()}
function saveEdit(){if(!selected)return;selected.updated=now();scheduleSave()}
function editorView(){let n=selected;if(!n)return screen='home',show();el.innerHTML=`<div class="top"><button class="btn ghost" data-act="back">← New Note</button><span class="sub">✓ ${preview?'Preview':'Auto-save'}</span></div><input class="editor-title" id="title" placeholder="Title (optional)" value="${esc(n.title)}"><div class="tools">${ib('palette','Note background color','bg',panel==='bg')}${ib('brush','Text color','ink',panel==='ink')}${ib('folder','Folder','folder',panel==='folder')}${ib('list','To-do list','todo',n.type==='todo')}${ib('bell','Reminder','reminder',panel==='reminder')}${ib('pin','Pin to top','pin',n.pinned)}${ib('lock','Lock this note','notelock',n.locked)}${ib('camera','Copy note as image','camera')}${ib('send','Share note','send')}</div><div id="panel"></div><div class="paper" style="background:${n.bg};--ink:${n.ink}"><div id="editorbody"></div></div><div class="row" style="justify-content:space-between;margin-top:14px"><span class="muted">Created ${fmt(n.created)}</span><span class="muted">${n.folder?esc(n.folder)+' · ':''}${n.locked?'🔒 ':''}${n.pinned?'📌 ':''}●</span></div><div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn light" data-act="delete">Delete note</button></div>`;$('#title').oninput=e=>{n.title=e.target.value;saveEdit()};renderEditorBody();renderPanel();bindActions();localize()}
function renderEditorBody(){let n=selected;if(n.type==='text'){$('#editorbody').innerHTML=`<textarea id="body" placeholder="Start writing your note..." style="color:${n.ink}">${esc(n.body)}</textarea>`;$('#body').oninput=e=>{n.body=e.target.value;saveEdit()}}else{$('#editorbody').innerHTML=n.tasks.map((t,i)=>`<div class="task"><input type="checkbox" data-check="${i}" ${t.done?'checked':''}><input type="text" data-task="${i}" value="${esc(t.text)}" placeholder="Task" style="color:${n.ink}"><button data-remove="${i}" aria-label="Remove task">×</button></div>`).join('')+`<button class="btn light" id="addtask">+ Add task</button>`;document.querySelectorAll('[data-check]').forEach(x=>x.onchange=()=>{n.tasks[+x.dataset.check].done=x.checked;saveEdit()});document.querySelectorAll('[data-task]').forEach(x=>x.oninput=()=>{n.tasks[+x.dataset.task].text=x.value;saveEdit()});document.querySelectorAll('[data-remove]').forEach(x=>x.onclick=()=>{n.tasks.splice(+x.dataset.remove,1);saveEdit();renderEditorBody()});$('#addtask').onclick=()=>{n.tasks.push({text:'',done:false});saveEdit();renderEditorBody();document.querySelectorAll('[data-task]')[n.tasks.length-1]?.focus()}}}
function renderPanel(){let n=selected,box=$('#panel');if(!panel){box.innerHTML='';return}if(panel==='bg'||panel==='ink'){let a=panel==='bg'?BG:INK;box.innerHTML=`<div class="panel"><b>${panel==='bg'?'Note Color':'Text Color'}</b><div class="swatches">${a.map(c=>`<button class="swatch ${c===(panel==='bg'?n.bg:n.ink)?'active':''}" data-color="${c}" style="background:${c}" title="${c}"></button>`).join('')}</div></div>`;box.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{n[panel==='bg'?'bg':'ink']=b.dataset.color;saveEdit();panel='';editorView()})}else if(panel==='folder'){box.innerHTML=`<div class="panel"><b>Choose folder</b><select id="folderSelect" style="width:100%;margin-top:10px"><option value="">No folder</option>${vault.folders.map(f=>`<option ${f===n.folder?'selected':''}>${esc(f)}</option>`).join('')}</select></div>`;$('#folderSelect').onchange=e=>{n.folder=e.target.value;saveEdit();panel='';editorView()}}else if(panel==='reminder'){box.innerHTML=`<div class="panel"><b>Reminder</b><div class="row wrap" style="margin-top:10px"><input type="datetime-local" id="remind" value="${esc(n.reminder)}"><button class="btn light" id="clearRemind">Clear</button></div><p class="muted" style="margin-top:8px">Alerts work while the app is open.</p></div>`;$('#remind').onchange=e=>{n.reminder=e.target.value;saveEdit();toast(tr('Reminder saved'))};$('#clearRemind').onclick=()=>{n.reminder='';saveEdit();panel='';editorView()}}}
function settingsView(){el.innerHTML=`<div class="top"><button class="btn ghost" data-act="home">← ${tr('Back')}</button><h2>${tr('Settings')}</h2></div><button class="setting" data-act="pinchange">🔐 ${tr('Change PIN')} <span>›</span></button><button class="setting" data-act="themes">🎨 ${tr('Background Themes')} <span class="setting-right">${esc(THEMES[visual.theme].name)} &nbsp; ›</span></button><label class="toggle-setting"><span>🌙 ${tr('Dark Mode')}</span><input type="checkbox" id="darkToggle" ${visual.dark?'checked':''}></label><label class="toggle-setting"><span>✨ ${tr('Live Animation')}</span><input type="checkbox" id="motionToggle" ${visual.motion?'checked':''}></label><button class="setting" data-act="export">📦 ${tr('Backup & Export')} <span>↓</span></button><button class="setting" data-act="import">📥 ${tr('Import Backup')} <span>↑</span></button><button class="setting" data-act="folders">📁 ${tr('Manage Folders')} <span>›</span></button><button class="setting" data-act="lockapp">🔒 ${tr('Lock App')} <span>›</span></button><p class="muted" style="margin-top:20px">${preview?'Preview notes are temporary. Theme settings are saved on this device.':'Notes are encrypted in this browser. Theme preferences are saved locally. Export backups regularly.'}</p><input type="file" id="importFile" accept="application/json,.json" hidden>`;bindActions();$('#importFile').onchange=importBackup;$('#darkToggle').onchange=e=>{updateVisual({dark:e.target.checked});show()};$('#motionToggle').onchange=e=>{updateVisual({motion:e.target.checked});show()}}
function themesView(){let t=THEMES[visual.theme];el.innerHTML=`<div class="top"><button class="btn ghost" data-act="settings">← ${tr('Back')}</button><h2>🎨 ${tr('Background Themes')}</h2></div><p class="sub">${tr('Choose one of 12 backgrounds')}</p><div class="theme-grid">${THEMES.map((th,i)=>`<button type="button" class="theme-option ${visual.theme===i?'selected':''}" data-theme="${i}" aria-label="${th.name}" aria-pressed="${visual.theme===i}"><span class="theme-thumb" style="background:linear-gradient(135deg,${th.colors.join(',')})">${visual.theme===i?'✓':''}</span><small>${th.name}</small></button>`).join('')}</div><div class="theme-preview"><div>My Notes 📝 · ${esc(t.name)}</div><div>📌 Today's Tasks</div><div>💡 My Ideas</div></div><button class="btn done-btn" data-act="settings">${tr('Done')} ✓</button>`;bindActions();document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{updateVisual({theme:Number(b.dataset.theme)});show()})}
function pinChangeView(){el.innerHTML=`<div class="top"><button class="btn ghost" data-act="settings">← Back</button><h2>Change PIN</h2></div><div class="panel"><form id="changeform"><p class="sub">Current 4-digit PIN</p><input id="old" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" required style="width:100%;margin:8px 0 15px"><p class="sub">New 4-digit PIN</p><input id="new" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" required style="width:100%;margin:8px 0 15px"><p class="sub">Confirm new PIN</p><input id="confirm" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" required style="width:100%;margin:8px 0 15px"><button class="btn" type="submit">Change PIN</button></form></div>`;bindActions();$('#changeform').onsubmit=async e=>{e.preventDefault();if(preview)return toast('PIN cannot change in preview');let old=$('#old').value,p=$('#new').value,c=$('#confirm').value;if(!/^\d{4}$/.test(old)||!/^\d{4}$/.test(p))return toast(tr('Enter a 4-digit PIN'));if(p!==c)return toast(tr('PIN codes do not match'));try{await decrypt(localStorage.getItem(KEY),old)}catch(e){return toast(tr('Current PIN is incorrect'))}try{await flushSave();let ns=rand(16),nk=await derive(p,ns),data=await encrypt(vault,nk,ns);localStorage.setItem(KEY,data);cryptoKey=nk;salt=ns;screen='settings';show();toast(tr('PIN changed successfully'))}catch(e){toast(tr('PIN change failed'))}}}
function foldersView(){el.innerHTML=`<div class="top"><button class="btn ghost" data-act="home">← Back</button><h2>Folders</h2></div><div class="panel"><div class="row"><input id="folderName" placeholder="New folder name" class="grow"><button class="btn" id="addFolder">Add</button></div></div>${vault.folders.map(f=>`<div class="setting"><span>📁 ${esc(f)}</span><button class="btn light" data-removefolder="${esc(f)}">Delete</button></div>`).join('')}`;bindActions();$('#addFolder').onclick=()=>{let f=$('#folderName').value.trim().slice(0,40);if(!f||vault.folders.includes(f))return toast(tr('Enter a unique folder name'));vault.folders.push(f);scheduleSave();show()};document.querySelectorAll('[data-removefolder]').forEach(b=>b.onclick=()=>{if(!confirm(tr('Delete folder? Notes will be kept.')))return;vault.folders=vault.folders.filter(f=>f!==b.dataset.removefolder);vault.notes.forEach(n=>{if(n.folder===b.dataset.removefolder)n.folder=''});scheduleSave();show()})}
function bindActions(){document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act))}
async function act(a){if(a==='home'||a==='back'){try{await flushSave()}catch{}screen='home';panel='';show()}else if(a==='settings'||a==='pinchange'||a==='folders'||a==='themes'){screen=a;show()}else if(a==='new')newNote();else if(a==='lockapp'){try{await flushSave()}catch{return toast(tr('Saving failed. Export a backup!'))}vault=null;selected=null;cryptoKey=null;sessionUnlocked=false;preview=false;screen='lock';show()}else if(a==='dark'||a==='darkon'||a==='lighton'){updateVisual({dark:a==='darkon'?true:a==='lighton'?false:!visual.dark});show()}else if(a==='design'){updateVisual({design:visual.design==='glass'?'original':'glass'});show()}else if(a==='language'){let pop=$('#lang-pop');if(pop)pop.hidden=!pop.hidden;document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{updateVisual({lang:b.dataset.lang});show()})}else if(a==='bg'||a==='ink'||a==='folder'||a==='reminder'){panel=panel===a?'':a;editorView()}else if(a==='todo'){selected.type=selected.type==='todo'?'text':'todo';saveEdit();editorView()}else if(a==='pin'){selected.pinned=!selected.pinned;saveEdit();editorView()}else if(a==='notelock'){selected.locked=!selected.locked;saveEdit();editorView()}else if(a==='delete'){if(confirm(tr('Delete this note permanently?'))){vault.notes=vault.notes.filter(n=>n!==selected);selected=null;try{await flushSave()}catch{}screen='home';show()}}else if(a==='camera')await copyImage();else if(a==='send')await shareImage();else if(a==='export')exportBackup();else if(a==='import')$('#importFile')?.click()}
function download(blob,name){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}
async function exportBackup(){try{await flushSave()}catch{}let blob=new Blob([JSON.stringify({app:'My Notes',version:1,exported:now(),data:vault},null,2)],{type:'application/json'});download(blob,'my-notes-backup-'+new Date().toISOString().slice(0,10)+'.json');toast(tr('Backup exported. Keep the file private: it is NOT encrypted.'))}
async function importBackup(e){let file=e.target.files?.[0];if(!file)return;try{let o=JSON.parse(await file.text());if(o.app!=='My Notes'||!Array.isArray(o.data?.notes)||!Array.isArray(o.data?.folders))throw Error('Invalid backup');if(!confirm(tr('Replace all current notes with this backup?')))return;vault=normalizeVault(o.data);if(Number.isInteger(vault.theme)&&vault.theme>=0&&vault.theme<THEMES.length)updateVisual({theme:vault.theme,motion:vault.motion!==false,dark:!!vault.dark});try{await flushSave()}catch{}screen='home';show();toast(tr('Backup imported'))}catch(err){toast(tr('Invalid backup file'))}}
function wrap(ctx,text,max){let lines=[];for(let para of String(text).split('\n')){let words=para.split(/\s+/),line='';for(let w of words){if(ctx.measureText(line+(line?' ':'')+w).width>max&&line){lines.push(line);line=w}else line+=(line?' ':'')+w}lines.push(line)}return lines}
function renderImage(){let n=selected,cv=document.createElement('canvas'),ctx=cv.getContext('2d'),W=1080,pad=70;ctx.font='bold 42px system-ui';let heading=wrap(ctx,n.title||'Untitled',W-pad*2);ctx.font='bold 32px system-ui';let text=n.type==='todo'?n.tasks.map(t=>(t.done?'☑ ':'☐ ')+t.text).join('\n'):n.body;let lines=wrap(ctx,text,W-pad*2);let h=Math.max(420,110+heading.length*58+lines.length*48+105);cv.width=W;cv.height=Math.min(h,16000);ctx.fillStyle=n.bg;ctx.fillRect(0,0,cv.width,cv.height);ctx.fillStyle=n.ink;ctx.textBaseline='top';ctx.font='bold 42px system-ui';let y=65;for(let line of heading){ctx.fillText(line,pad,y);y+=58}y+=25;ctx.font='bold 32px system-ui';for(let line of lines){if(y>cv.height-90)break;ctx.fillText(line,pad,y);y+=48}ctx.font='22px system-ui';ctx.globalAlpha=.75;ctx.fillText(fmt(n.created),pad,cv.height-55);ctx.globalAlpha=1;return cv}
function canvasBlob(cv){return new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(Error('Image failed')),'image/png'))}
async function copyImage(){try{let blob=await canvasBlob(renderImage());if(navigator.clipboard?.write&&window.ClipboardItem&&isSecureContext){await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);toast('Image copied! Paste it in Telegram with Ctrl+V.')}else{download(blob,'my-note.png');toast('Image downloaded. Attach it in Telegram.')}}catch(e){try{download(await canvasBlob(renderImage()),'my-note.png');toast('Clipboard unavailable; PNG downloaded.')}catch(x){toast('Could not create image')}}}
async function shareImage(){try{let blob=await canvasBlob(renderImage()),file=new File([blob],'my-note.png',{type:'image/png'});if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:selected.title||'My Note'})}else{download(blob,'my-note.png');toast('PNG downloaded. Attach it in Telegram or another app.')}}catch(e){if(e.name!=='AbortError')toast('Sharing not available on this device')}}
setInterval(()=>{if(!vault||preview)return;let t=Date.now();for(let n of vault.notes){if(n.reminder&&!reminded.has(n.id+n.reminder)&&new Date(n.reminder).getTime()<=t){reminded.add(n.id+n.reminder);toast('🔔 Reminder: '+n.title)}}},20000);
window.addEventListener('pagehide',()=>{if(selected&&screen==='edit')saveEdit()});show();
</script></body></html>
